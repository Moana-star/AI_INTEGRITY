name: Python tests

on:
  push:
    branches: ["main", "feature/institutional-eims-foundation", "feature/eims-institutional-completion"]
  pull_request:
    branches: ["main", "feature/institutional-eims-foundation"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: eims_test_password
          POSTGRES_DB: eims_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eims_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EIMS_POSTGRES_TEST_URL: postgresql+psycopg://postgres:eims_test_password@localhost:5432/eims_migration_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py modules database tests
      - name: Run unit tests
        run: python -m unittest discover -v
