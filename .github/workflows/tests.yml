name: Python tests

on:
  push:
    branches: ["main", "feature/institutional-eims-foundation", "feature/eims-institutional-completion"]
  pull_request:
    branches: ["main", "feature/institutional-eims-foundation"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py modules database tests
      - name: Run unit tests
        run: python -m unittest discover -v
