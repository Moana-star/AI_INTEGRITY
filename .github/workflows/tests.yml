name: Python tests

on:
  push:
    branches: ["main", "feature/institutional-eims-foundation", "feature/eims-institutional-completion"]
  pull_request:
    branches: ["main", "feature/institutional-eims-foundation"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: eims_test_password
          POSTGRES_DB: eims_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eims_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EIMS_POSTGRES_TEST_URL: postgresql+psycopg://postgres:eims_test_password@localhost:5432/eims_migration_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py modules database tests
      - name: Run unit tests
        run: python -m unittest discover -v

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install application and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Initialize isolated synthetic test database
        env:
          EIMS_BOOTSTRAP_ADMIN_USERNAME: ci-admin
          EIMS_BOOTSTRAP_ADMIN_PASSWORD: ci-only-bootstrap-password-not-used-for-login-2026
        run: python database/database.py
      - name: Start Flask application
        env:
          FLASK_SECRET_KEY: ci-only-random-test-secret
          FLASK_DEBUG: "0"
        run: |
          nohup python app.py > /tmp/eims-browser.log 2>&1 &
          echo $! > /tmp/eims-browser.pid
      - name: Wait for application readiness
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request
          for attempt in range(40):
              try:
                  urllib.request.urlopen("http://127.0.0.1:5000/healthz", timeout=2)
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise SystemExit("EIMS did not become ready; inspect /tmp/eims-browser.log")
          PY
      - name: Run real Chromium browser smoke tests
        env:
          EIMS_BROWSER_BASE_URL: http://127.0.0.1:5000
        run: python -m unittest discover -s tests/browser -v
      - name: Print server log on failure
        if: failure()
        run: test ! -f /tmp/eims-browser.log || cat /tmp/eims-browser.log

  postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: eims_runtime_password
          POSTGRES_DB: eims_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eims_runtime_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EIMS_POSTGRES_URL: postgresql+psycopg://postgres:eims_runtime_password@localhost:5432/eims_runtime_test
      DATABASE_URL: postgresql+psycopg://postgres:eims_runtime_password@localhost:5432/eims_runtime_test
      EIMS_BOOTSTRAP_ADMIN_USERNAME: ci-runtime-admin
      EIMS_BOOTSTRAP_ADMIN_PASSWORD: ci-only-runtime-bootstrap-password-not-used-for-login-2026
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Bootstrap an empty-first PostgreSQL deployment
        run: python scripts/bootstrap_postgres.py
      - name: Verify bootstrap is non-destructive on an existing EIMS database
        run: python scripts/bootstrap_postgres.py
      - name: Exercise Flask runtime and module schema creation on PostgreSQL
        run: python -m unittest tests.test_postgres_runtime_integration -v

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build non-root production container
        run: docker build --tag eims:ci .
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_DB: eims_ci
          POSTGRES_USER: eims_ci
          POSTGRES_PASSWORD: ci-only-compose-password
          FLASK_SECRET_KEY: ci-only-compose-secret-key-long-enough-for-validation
          EIMS_BOOTSTRAP_ADMIN_USERNAME: ci-admin
          EIMS_BOOTSTRAP_ADMIN_PASSWORD: ci-only-compose-bootstrap-password
        run: docker compose config --quiet
