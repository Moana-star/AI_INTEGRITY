{% extends "base.html" %}
{% block title %}Change Student Password | EIMS{% endblock %}
{% block content %}
<section class="page-header"><div><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change your password</h1><p class="muted">Use a strong password that is unique to your EIMS account.</p></div></section>
<section class="panel form-panel" style="max-width:560px">{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}<form method="post" class="stack-form"><label>New password<input type="password" name="password" minlength="12" autocomplete="new-password" required></label><label>Confirm new password<input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></label><button class="button button-primary" type="submit">Update password</button></form></section>
{% endblock %}
